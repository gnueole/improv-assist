# ==============================================================================
# 🚀 AUTOMATED WORKFLOW: BUILD & RELEASE HOUBA HOUBA !
# ==============================================================================
# Trigger    : Every push on the 'main' branch
# Objective  : Compile the Next.js production image and publish it immutably
#              to the GitHub Packages Registry (GHCR) using Node 24 runners.
# ==============================================================================

name: "⚙️ CI/CD - Build & Publish to GHCR"

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # ⚡ Opt-in into Node.js 24 runner execution now to clear deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: 🏗️ Compile & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout source code
        uses: actions/checkout@v4 # Validated for Node 24 runner lifecycle

      - name: 🛠️ Set up Docker Buildx engine
        uses: docker/setup-buildx-action@v3 # Node 24 compatible version

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3

      - name: 🏷️ Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5

      - name: 🚀 Build production image & Push to GHCR
        uses: docker/build-push-action@v6 # Upgraded to v6 for full Node 24/25 compliance
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GA_ID=${{ secrets.PROD_GA_ID }}