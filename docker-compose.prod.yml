services:
  improv-assist-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: improv-assist-frontend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    labels:
      - "traefik.enable=true"
      # Route via the shared Traefik reverse proxy
      - "traefik.http.routers.improv-assist.rule=Host(`${IMPROV_DOMAIN:-impro.eole.me}`)"
      - "traefik.http.routers.improv-assist.entrypoints=websecure"
      - "traefik.http.routers.improv-assist.tls=true"
      - "traefik.http.routers.improv-assist.tls.certresolver=myresolver"
      - "traefik.http.services.improv-assist.loadbalancer.server.port=3000"
      
      # Log collection via global Vector agent
      - "vector.dev/collect=true"
      - "vector.dev/dataset=improv-assist"
    networks:
      - default

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-eole_shared_network}
    external: true
