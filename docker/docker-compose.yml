name: improv-assist-dev

services:
  # --- FRONTEND (Local Dev with HMR) ---
  improv-assist-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: improv-assist-frontend-dev
    ports:
      - "3030:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Essential for HMR in Windows/WSL2 hosts
      - NEXT_TELEMETRY_DISABLED=1
      - GOOGLE_TAG_ID=${GOOGLE_TAG_ID}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
    env_file:
      - ../.env
    networks:
      - eole_shared_network

  # --- LOCAL MOCK SERVICES (Standalone Profile for community/forks) ---
  traefik:
    image: traefik:latest
    container_name: improv-traefik-local
    profiles:
      - standalone
    ports:
      - "80:80"
      - "443:443"
    networks:
      - eole_shared_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: improv-n8n-local
    profiles:
      - standalone
    networks:
      - eole_shared_network

networks:
  eole_shared_network:
