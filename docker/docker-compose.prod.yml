name: improv-assist

services:
  improv-assist-frontend:
    image: ghcr.io/gnueole/improv-assist:latest
    container_name: improv-assist-frontend-prod
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - GOOGLE_TAG_ID=${GOOGLE_TAG_ID}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
      - X_N8N_TOKEN=${X_N8N_TOKEN}
      - N8N_BASE_URL=${N8N_BASE_URL}
      # Never passed before, so the container always fell back to whatever the
      # image had baked in — and a July image still pointed at /jobby-feedback,
      # retired since. Every submission answered 404 in silence.
      - N8N_FEEDBACK_WEBHOOK_URL=${N8N_FEEDBACK_WEBHOOK_URL:-http://n8n-server:5678/webhook/feedback}
      # Telemetry goes to Vector, which ships to Axiom — not to n8n, and not to
      # a Notion database.
      - TELEMETRY_WEBHOOK_URL=${TELEMETRY_WEBHOOK_URL:-http://vector:8080}
    networks:
      - eole_shared_network
    extra_hosts:
      - "n8n.eole.me:host-gateway"
    labels:
      # Ships this container's logs to Axiom. Vector collects by this label —
      # improv was the only project not declaring it, so it shipped nothing.
      - "vector.dev/collect=true"
      - "traefik.enable=true"
      - "traefik.http.routers.improv.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.improv.entrypoints=websecure"
      - "traefik.http.routers.improv.tls=true"
      - "traefik.http.routers.improv.tls.certresolver=letsencrypt"
      - "traefik.http.services.improv.loadbalancer.server.port=3000"

networks:
  eole_shared_network:
    name: ${DOCKER_NETWORK_NAME}
    external: ${DOCKER_NETWORK_EXTERNAL}
